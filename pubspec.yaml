name: type_with_yash
description: "Type with Yash - Practice Today. Type Tomorrow. Developed by Yash Shukla"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  window_manager: ^0.5.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+2
  pdf: ^3.11.3
  printing: ^5.14.2
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/passages.json
